# EXAMPLE ONLY. Not applied by kustomization.yaml. Create the real secret out of band:
#   kubectl create secret generic agentic-reporting-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
# On EKS prefer IRSA / Pod Identity for Bedrock over static AWS keys.
apiVersion: v1
kind: Secret
metadata:
  name: agentic-reporting-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "replace-me"
