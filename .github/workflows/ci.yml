name: ci

# Every job is offline and deterministic: the fake provider, synthetic data, no keys.
#
#   test (3.12, 3.13) ── pytest over the whole pipeline, private-mode test included
#   eval               ── golden reports: every section present, 0 unverified, fabrication caught;
#                         golden schema questions: linking + execution accuracy, unsafe SQL refused
#   chat-eval          ── golden chatbot questions on AdventureWorks (downloaded, sha256-pinned):
#                         ask-back, refusals, understanding, execution, dropped-filter control
#   ontology           ── the ontology layer (optional extra): ontology/*.ttl match the specs, SHACL
#                         conforms, every shape's mutation is caught, SPARQL = SQL on AdventureWorks
#   graphdb            ── Neo4j 5 as a service container: the graph loads idempotently, equals the RDF
#                         graph (mutations caught), Cypher = SQL, governed text-to-Cypher (offline writer)
#   lint               ── ruff
#   docker             ── the image builds (not pushed)
#   k8s                ── the manifests render

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ''
  LLM_PROVIDER: fake
  PYTHONUTF8: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: make samples PY=python
      - run: pytest -q

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m eval.report_eval --fake
      - run: python -m eval.schema_linking_eval --fake

  # The one job that downloads: AdventureWorks DW (Microsoft sample, MIT) at a pinned commit,
  # every file checked against its sha256 before it is loaded. Then the chatbot gate, offline.
  chat-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: samples/.cache
          key: adventureworks-${{ hashFiles('samples/load_adventureworks.py') }}
      - run: pip install -e ".[dev]"
      - run: python samples/load_adventureworks.py
      - run: python -m eval.chat_eval --fake
      - run: python -m eval.rag_eval --fake
      - name: AdventureWorks monthly report builds offline, every number traced
        run: |
          python -m agentic_reporting.run --spec specs/aw_monthly.yaml --provider fake --no-gate             --out /tmp/aw --checkpoint-db /tmp/aw/cp.sqlite | tee /tmp/aw.log
          grep -q "0 unverified" /tmp/aw.log
          test -f /tmp/aw/aw_monthly/*.html

  # The ontology layer (ADR-0007). It needs the optional [ontology] extra (rdflib, pyshacl), so it
  # has its own job; the test job above installs only [dev] and skips tests/test_ontology.py.
  # AdventureWorks is loaded so SPARQL is checked against SQL on the full sample, not just the
  # fixture.
  ontology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: samples/.cache
          key: adventureworks-${{ hashFiles('samples/load_adventureworks.py') }}
      - run: pip install -e ".[dev,ontology]"
      - run: python samples/load_adventureworks.py
      - name: ontology/*.ttl match the specs; the AdventureWorks graph conforms to the shapes
        run: >
          python -m agentic_reporting.ontology --check --db samples/adventureworks.sqlite
          --instances /tmp/kg/adventureworks.ttl
      - run: pytest -q tests/test_ontology.py

  # The graph database (ADR-0007 step 5). Neo4j runs as a service container on the runner only;
  # its password is made per run from the run id, so none is stored in the repo. The test job
  # above has no neo4j driver and no NEO4J_* variables, so tests/test_graphdb.py skips there.
  graphdb:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci-${{ github.run_id }}-${{ github.run_attempt }}
          NEO4J_server_memory_heap_max__size: 1G
          NEO4J_dbms_usage__report_enabled: 'false'
        ports:
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: samples/.cache
          key: adventureworks-${{ hashFiles('samples/load_adventureworks.py') }}
      - run: pip install -e ".[dev,graphdb]"
      - run: python samples/load_adventureworks.py
      - name: wait for Neo4j
        run: |
          python - <<'EOF'
          import time
          from agentic_reporting.graphdb import connect
          for i in range(60):
              try:
                  connect().close(); print("neo4j up after", i * 2, "s"); break
              except Exception as e:
                  time.sleep(2)
          else:
              raise SystemExit("neo4j did not start")
          EOF
      - name: load AdventureWorks into Neo4j; the database equals the plan
        run: python -m agentic_reporting.graphdb --db samples/adventureworks.sqlite
      - run: pytest -q tests/test_graphdb.py
      - name: text-to-Cypher golden questions (offline writer) and its negative controls
        run: python -m eval.cypher_eval --fake

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Pinned so a new ruff release cannot break an unchanged tree.
      - run: pip install 'ruff==0.16.9'
      - run: ruff check .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentic-reporting:ci
      - name: smoke-run the image (fake provider, no gate)
        run: >
          docker run --rm agentic-reporting:ci
          --spec specs/sales_mbr.yaml --db samples/sales.sqlite --provider fake --no-gate
          --out /tmp/reports --checkpoint-db /tmp/cp.sqlite

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render Kubernetes manifests
        run: kubectl kustomize deploy/k8s > /tmp/rendered.yaml && grep -c '^kind:' /tmp/rendered.yaml
