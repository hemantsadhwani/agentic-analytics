# Governed metrics: the one agreed definition of each business number (synthetic samples
# and the public AdventureWorks DW sample).
#
# The schema graph (agentic_reporting/schema_graph.py) loads a metric into a database's graph
# only if its table and every column it derives from exist there, so one file serves both
# sample databases. Schema linking finds a metric by its name or a synonym; the SQL writer
# is told to use `expression` as written. Change a definition here, in review, never in a
# prompt. `derives_from` lists columns (table.column) and other metrics (metric:<name>).
metrics:
  # --- samples/sales.sqlite --------------------------------------------------------------
  - name: net_revenue
    label: Net revenue
    table: orders
    expression: ROUND(SUM(orders.revenue), 2)
    grain: order line; sum over any dimension (region, product, customer) or period
    time_column: orders.order_date
    derives_from: [orders.revenue]
    synonyms: [revenue, sales, turnover, net sales, income]
    owner: Finance analytics (synthetic owner)
    description: Revenue after line discounts (orders.revenue is already net of discount).

  - name: orders
    label: Orders
    table: orders
    expression: COUNT(DISTINCT orders.order_id)
    grain: one order per orders row; count over any dimension or period
    time_column: orders.order_date
    derives_from: [orders.order_id]
    synonyms: [order count, number of orders, order volume, orders placed]
    owner: Sales operations (synthetic owner)
    description: Number of distinct orders.

  - name: mom_change_pct
    label: Month-on-month change in net revenue (%)
    table: orders
    expression: ROUND(100.0 * (cur.net_revenue - prev.net_revenue) / prev.net_revenue, 1)
    grain: >-
      calendar month; cur and prev are net_revenue for month m and month m-1, where
      month = substr(orders.order_date, 1, 7)
    time_column: orders.order_date
    derives_from: [metric:net_revenue, orders.order_date]
    synonyms: [month over month change, mom change, mom, monthly change, revenue growth,
               change in sales, change in revenue]
    owner: Finance analytics (synthetic owner)
    description: Percent change of net revenue against the previous calendar month.

  # --- samples/ops.sqlite ----------------------------------------------------------------
  - name: incident_count
    label: Incident count
    table: incidents
    expression: COUNT(incidents.incident_id)
    grain: one incident per incidents row; count over any dimension or period
    time_column: incidents.opened_at
    derives_from: [incidents.incident_id]
    synonyms: [incidents, number of incidents, incident volume, outages]
    owner: SRE leadership (synthetic owner)
    description: Number of incidents opened.

  - name: mttr_hours
    label: Mean time to restore (hours)
    table: incidents
    expression: ROUND(AVG(incidents.minutes_to_restore) / 60.0, 3)
    grain: incident; average over any dimension or period
    time_column: incidents.opened_at
    derives_from: [incidents.minutes_to_restore]
    synonyms: [mttr, mean time to restore, time to restore, restore time, mean time to recovery,
               recovery time]
    owner: SRE leadership (synthetic owner)
    description: Average minutes from open to restore, in hours.

  - name: sev1_share
    label: SEV1 share of incidents (%)
    table: incidents
    expression: ROUND(100.0 * SUM(incidents.severity = 'SEV1') / COUNT(incidents.incident_id), 2)
    grain: incident; a percentage over any dimension or period
    time_column: incidents.opened_at
    derives_from: [metric:incident_count, incidents.severity]
    synonyms: [sev1 share, share of sev1, sev1 rate, sev1 percentage, critical incident share]
    owner: SRE leadership (synthetic owner)
    description: Percent of incidents whose severity is SEV1 (the worst).

  # --- samples/adventureworks.sqlite (Microsoft AdventureWorks DW, MIT; public sample) ----
  # Two sales channels, two fact tables. A plain "sales" is ambiguous here, so it is listed
  # under `ambiguous:` below and the bot asks which channel is meant.
  - name: internet_sales
    label: Internet sales (USD)
    table: FactInternetSales
    expression: ROUND(SUM(FactInternetSales.SalesAmount), 2)
    grain: order line; sum over any dimension (product, territory, customer, promotion) or period
    time_column: FactInternetSales.OrderDate
    derives_from: [FactInternetSales.SalesAmount]
    synonyms: [internet sales, online sales, web sales, internet revenue, online revenue,
               ecommerce sales, internet sale amount]
    owner: Digital sales (sample owner)
    description: Sales amount of internet orders, after discounts, before tax and freight.

  - name: internet_orders
    label: Internet orders
    table: FactInternetSales
    expression: COUNT(DISTINCT FactInternetSales.SalesOrderNumber)
    grain: one order per SalesOrderNumber (an order has several lines); count over any dimension or period
    time_column: FactInternetSales.OrderDate
    derives_from: [FactInternetSales.SalesOrderNumber]
    synonyms: [internet orders, online orders, web orders, number of internet orders,
               number of online orders]
    owner: Digital sales (sample owner)
    description: Number of distinct internet orders (not order lines).

  - name: internet_units
    label: Internet units sold
    table: FactInternetSales
    expression: SUM(FactInternetSales.OrderQuantity)
    grain: order line; sum over any dimension or period
    time_column: FactInternetSales.OrderDate
    derives_from: [FactInternetSales.OrderQuantity]
    synonyms: [internet units, online units, units sold online, units sold on the internet,
               online quantity]
    owner: Digital sales (sample owner)
    description: Units sold through internet orders.

  - name: internet_gross_margin
    label: Internet gross margin (USD)
    table: FactInternetSales
    expression: ROUND(SUM(FactInternetSales.SalesAmount - FactInternetSales.TotalProductCost), 2)
    grain: order line; sum over any dimension or period
    time_column: FactInternetSales.OrderDate
    derives_from: [FactInternetSales.SalesAmount, FactInternetSales.TotalProductCost]
    synonyms: [internet gross margin, online gross margin, internet margin, online margin,
               internet profit, online profit, internet gross profit, online gross profit]
    owner: Finance analytics (sample owner)
    description: Sales amount minus standard product cost, internet orders.

  - name: reseller_sales
    label: Reseller sales (USD)
    table: FactResellerSales
    expression: ROUND(SUM(FactResellerSales.SalesAmount), 2)
    grain: order line; sum over any dimension (product, territory, reseller, promotion) or period
    time_column: FactResellerSales.OrderDate
    derives_from: [FactResellerSales.SalesAmount]
    synonyms: [reseller sales, reseller revenue, channel sales, wholesale sales, dealer sales,
               store sales]
    owner: Channel sales (sample owner)
    description: Sales amount of reseller (bike shop) orders, after discounts, before tax.

  - name: reseller_orders
    label: Reseller orders
    table: FactResellerSales
    expression: COUNT(DISTINCT FactResellerSales.SalesOrderNumber)
    grain: one order per SalesOrderNumber; count over any dimension or period
    time_column: FactResellerSales.OrderDate
    derives_from: [FactResellerSales.SalesOrderNumber]
    synonyms: [reseller orders, dealer orders, channel orders, number of reseller orders]
    owner: Channel sales (sample owner)
    description: Number of distinct reseller orders (not order lines).

  - name: reseller_units
    label: Reseller units sold
    table: FactResellerSales
    expression: SUM(FactResellerSales.OrderQuantity)
    grain: order line; sum over any dimension or period
    time_column: FactResellerSales.OrderDate
    derives_from: [FactResellerSales.OrderQuantity]
    synonyms: [reseller units, units sold to resellers, dealer units, reseller quantity]
    owner: Channel sales (sample owner)
    description: Units sold through reseller orders.

  - name: reseller_gross_margin
    label: Reseller gross margin (USD)
    table: FactResellerSales
    expression: ROUND(SUM(FactResellerSales.SalesAmount - FactResellerSales.TotalProductCost), 2)
    grain: order line; sum over any dimension or period
    time_column: FactResellerSales.OrderDate
    derives_from: [FactResellerSales.SalesAmount, FactResellerSales.TotalProductCost]
    synonyms: [reseller gross margin, reseller margin, reseller profit, reseller gross profit,
               dealer margin]
    owner: Finance analytics (sample owner)
    description: Sales amount minus standard product cost, reseller orders.

# Words that name several governed metrics in one database. Used only when no specific
# metric matched and every option exists in that database; the bot then asks, it never guesses.
ambiguous:
  - phrases: [sales, revenue, turnover, sold, sell, sale amount]
    options: [internet_sales, reseller_sales]
    ask: This warehouse has two sales channels. Which sales do you mean?
  - phrases: [orders, order count, number of orders]
    options: [internet_orders, reseller_orders]
    ask: Internet orders or reseller orders?
  - phrases: [units, quantity, units sold]
    options: [internet_units, reseller_units]
    ask: Units sold online or to resellers?
  - phrases: [margin, gross margin, profit, gross profit]
    options: [internet_gross_margin, reseller_gross_margin]
    ask: Gross margin on internet or reseller sales?
