[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-reporting"
version = "0.1.0"
description = "Agentic report generation: LLM-drafted prose over read-only SQL facts, a deterministic number checker, a human publish gate, an audit trail."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "networkx>=3.2,<4",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
llm = ["anthropic[bedrock]>=0.49,<2"]
dev = ["pytest>=8", "ruff>=0.5"]
all = ["agentic-reporting[llm,dev]"]

[project.scripts]
agentic-reporting = "agentic_reporting.run:main"

[tool.setuptools]
packages = ["agentic_reporting", "agentic_reporting.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_reporting", "samples", "eval", "conftest"]
