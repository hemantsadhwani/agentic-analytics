[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-reporting"
version = "0.1.0"
description = "Agentic report generation: LLM-drafted prose over read-only SQL facts, a deterministic number checker, a human publish gate, an audit trail."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "networkx>=3.2,<4",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
llm = ["anthropic[bedrock]>=0.49,<2", "boto3>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]
# The ontology layer (agentic_reporting/ontology.py, ADR-0007): OWL/SKOS/SHACL/SPARQL. Optional;
# nothing on the default path imports it, and tests/test_ontology.py skips without it.
ontology = ["rdflib>=7.1,<8", "pyshacl>=0.30,<1"]
# The graph database (agentic_reporting/graphdb.py + text_to_cypher.py, ADR-0007 step 5): the official
# Neo4j driver on top of the ontology layer. Optional; tests/test_graphdb.py skips without it, and its
# server tests skip unless NEO4J_URI / NEO4J_USER / NEO4J_PASSWORD are set.
graphdb = ["neo4j>=5.28,<7", "agentic-reporting[ontology]"]
all = ["agentic-reporting[llm,dev,ontology,graphdb]"]

[project.scripts]
agentic-reporting = "agentic_reporting.run:main"

[tool.setuptools]
packages = ["agentic_reporting", "agentic_reporting.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The HTML renderer holds its CSS, page template and SVG markup as long strings.
"agentic_reporting/render_html.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_reporting", "samples", "eval", "conftest"]
